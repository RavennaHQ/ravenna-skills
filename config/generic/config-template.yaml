# Generic configuration template for agentskills

skills:
  # Directory containing skills
  directory: ./skills

  # Skills to enable
  enabled:
    - api-code-generator
    - code-action
    - debug-workflows

  # Auto-load skills on startup
  autoLoad: true

  # Watch for changes and reload
  watch: false

integrations:
  # Ravenna API integration
  ravenna:
    url: ${RAVENNA_API_URL}
    type: http

    # Authentication
    auth:
      type: bearer
      token: ${RAVENNA_API_KEY}

    # Request configuration
    timeout: 30000  # milliseconds

    # Retry configuration
    retry:
      maxAttempts: 3
      backoff: exponential

environment:
  # Environment files to load
  loadFrom:
    - .env
    - .env.local
