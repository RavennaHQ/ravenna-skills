# Generic configuration template for agentskills

[skills]
directory = "./skills"
enabled = ["api-code-generator", "code-action", "debug-workflows"]
autoLoad = true
watch = false

[integrations.ravenna]
url = "${RAVENNA_API_URL}"
type = "http"
timeout = 30000

[integrations.ravenna.auth]
type = "bearer"
token = "${RAVENNA_API_KEY}"

[integrations.ravenna.retry]
maxAttempts = 3
backoff = "exponential"

[environment]
loadFrom = [".env", ".env.local"]
